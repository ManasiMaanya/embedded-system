  <text x="50" y="696" font-size="11" font-family="Segoe UI,Arial">warm-up blink (P1)</text>

  <rect x="40" y="750" width="210" height="80" fill="#fff" stroke="#111" stroke-width="1.6"/>
  <text x="48" y="766" font-size="12" font-weight="700" font-family="Segoe UI,Arial">FAN B12  optional</text>

  <text x="50" y="788" font-size="11" font-family="Segoe UI,Arial">own USB 5 V  — no GPIO</text>

